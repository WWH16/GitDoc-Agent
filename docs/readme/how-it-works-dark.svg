<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-dark-title how-it-works-dark-desc" id="how-it-works-dark-root">
        <title id="how-it-works-dark-title">How GitDoc Agent works</title>
        <desc id="how-it-works-dark-desc">The web app calls three n8n workflows through an API guard that checks the session, rate limits and docs cache; the workflows read GitHub, render diagrams, call LLM providers and store code vectors in Supabase, which also holds accounts and history.</desc>
        <defs>
      <style>#how-it-works-dark-root { --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace; }
      #how-it-works-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #how-it-works-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#how-it-works-dark-root .diagram-container { overflow-x: visible; }
}</style>
